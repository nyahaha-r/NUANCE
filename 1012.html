const START=630,END=1350,SCALE=3,KEY='fes-20261012-fourvenues-v1';
const $=id=>document.getElementById(id);
const escapeHTML=text=>String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const areaByID=new Map(areas.map(area=>[area.id,area]));

const allShows=[...liveShows,...merchShows],knownIDs=new Set(allShows.map(show=>show.id));
let selected=new Set();
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&Array.isArray(saved.ids))selected=new Set(saved.ids.filter(id=>knownIDs.has(id)));}catch{}
function save(){try{localStorage.setItem(KEY,JSON.stringify({ids:[...selected]}));}catch{}}
function refresh(){
 for(const show of allShows){const input=$(show.id);input.checked=selected.has(show.id);input.closest('.artist').classList.toggle('is-selected',input.checked);}
 document.querySelectorAll('.event').forEach(card=>card.classList.toggle('selected',[...card.querySelectorAll('input')].some(input=>input.checked)));

}
function bind(input,id){input.addEventListener('change',event=>{if(event.target.checked)selected.add(id);else selected.delete(id);save();refresh();});}

$('timeline').style.height=`${(END-START)*SCALE}px`;
