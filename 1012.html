<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026年10月12日｜タイムテーブル</title>
<style>
:root{--ink:#1e293b;--line:#e2e8f0;--gutter:54px;--columns:repeat(4,minmax(235px,1fr));--scale:3}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#fff;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP","Yu Gothic",Meiryo,sans-serif}body{overflow:hidden}.viewport{height:100vh;height:100dvh;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable}.board{min-width:994px;width:100%;position:relative}.headers{height:62px;display:grid;grid-template-columns:var(--gutter) var(--columns);position:sticky;top:0;z-index:20;background:#fff;box-shadow:0 2px 5px #0f172a10}.time-header{position:sticky;left:0;z-index:22;display:flex;align-items:center;justify-content:center;font-size:11px;color:#64748b;background:#f8fafc;border-right:1px solid var(--line)}.venue-header{border-right:1px solid var(--line);border-bottom:1px solid var(--line);box-shadow:inset 0 3px var(--color);padding:11px 12px 8px}.venue-name{font-size:14px;font-weight:700;white-space:nowrap;margin:0 0 5px}.venue-meta{font-size:10px;color:#64748b;white-space:nowrap;margin:0}.timeline{height:1980px;position:relative;display:grid;grid-template-columns:var(--gutter) var(--columns)}.ruler{position:sticky;left:0;background:#f8fafc;border-right:1px solid var(--line);z-index:7}.tick{position:absolute;right:7px;transform:translateY(-50%);font-size:11px;color:#475569;font-variant-numeric:tabular-nums}.tick.half{font-size:10px;color:#94a3b8}.column{position:relative;border-right:1px solid var(--line);background-color:white;background-image:linear-gradient(to bottom,#cbd5e1 1px,transparent 1px),linear-gradient(to bottom,#e8edf4 1px,transparent 1px);background-size:100% 180px,100% 45px;background-position:0 90px,0 0}.event{position:absolute;left:5px;right:5px;z-index:2;display:flex;gap:7px;overflow:hidden;padding:5px 7px;border:1px solid var(--line);border-left:3px solid var(--color);border-radius:5px;background:color-mix(in srgb,var(--color),white 93%);cursor:pointer}.event:hover{filter:brightness(.975)}.event input{flex:none;width:14px;height:14px;margin:2px 0 0;accent-color:var(--color);cursor:pointer}.event input:focus-visible{outline:3px solid #2563eb;outline-offset:2px}.info{min-width:0;flex:1}.event-time{display:block;font-size:10px;line-height:14px;color:#64748b;font-variant-numeric:tabular-nums;white-space:nowrap}.event-name{font-size:12px;line-height:16px;font-weight:600;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow-wrap:anywhere}.event.short{padding:3px 6px;align-items:center;gap:5px}.event.short .info{display:flex;align-items:center;gap:5px}.event.short .event-time{font-size:9px;flex:none}.event.short .event-name{font-size:10px;line-height:12px}.event.selected{z-index:6;border-color:var(--color);box-shadow:0 0 0 1px var(--color);background:color-mix(in srgb,var(--color),white 77%)}.shadows{position:absolute;left:var(--gutter);right:0;top:0;bottom:0;z-index:4;pointer-events:none}.shadow{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,#33415528 0,#33415528 4px,#33415510 4px,#33415510 9px);border-top:1px solid #47556944;border-bottom:1px solid #47556944}@media print{body{overflow:visible}.viewport{height:auto;overflow:visible}.board{min-width:0}.headers{position:relative;grid-template-columns:45px repeat(4,minmax(0,1fr));height:60px}.timeline{grid-template-columns:45px repeat(4,minmax(0,1fr))}.venue-name{font-size:10px;white-space:normal}.venue-meta{font-size:8px;white-space:normal}.event-name{font-size:10px}.shadows{left:45px}}
</style>
</head>
<body>
<main class="viewport" aria-label="2026年10月12日・4会場のタイムテーブル">
<div class="board"><div class="headers" id="headers"></div><div class="timeline" id="timeline"><div class="ruler" id="ruler"></div><div class="shadows" id="shadows" aria-hidden="true"></div></div></div>
</main>
<script>
'use strict';
const venues=[{"id":"duo","name":"duo MUSIC EXCHANGE","fes":"さとモンFES 2026","open":"11:00","color":"#38bdf8","shows":[{"id":"duo-0","start":"11:30","end":"11:55","name":"Mi'Line Hearts"},{"id":"duo-1","start":"11:55","end":"12:20","name":"二丁目の魁カミングアウト"},{"id":"duo-2","start":"12:20","end":"12:45","name":"lonlium"},{"id":"duo-3","start":"12:45","end":"13:10","name":"限りなく白く"},{"id":"duo-4","start":"13:10","end":"13:35","name":"鳴ル神"},{"id":"duo-5","start":"13:45","end":"14:10","name":"雨模様のソラリス"},{"id":"duo-6","start":"14:10","end":"14:35","name":"HelloYouth"},{"id":"duo-7","start":"14:35","end":"15:00","name":"猫の眼に宇宙"},{"id":"duo-8","start":"15:05","end":"15:20","name":"ニコニコクラブ◎"},{"id":"duo-9","start":"15:20","end":"15:45","name":"SOMOSOMO"},{"id":"duo-10","start":"15:55","end":"16:20","name":"メルクマールメルマール"},{"id":"duo-11","start":"16:20","end":"16:45","name":"AZ-ON"},{"id":"duo-12","start":"16:45","end":"17:10","name":"MAGICAL SPEC"},{"id":"duo-13","start":"17:10","end":"17:35","name":"美味しい曖昧"},{"id":"duo-14","start":"17:35","end":"18:00","name":"絶対少女"},{"id":"duo-15","start":"18:15","end":"18:25","name":"がんばれりおちゃん!!"},{"id":"duo-16","start":"18:25","end":"18:50","name":"太陽と踊れ月夜に唄え"},{"id":"duo-17","start":"18:50","end":"19:15","name":"NUANCE"},{"id":"duo-18","start":"19:15","end":"19:40","name":"selfish"},{"id":"duo-19","start":"19:40","end":"20:05","name":"さよならステイチューン"},{"id":"duo-20","start":"20:25","end":"21:00","name":"さとりモンスター BAND SET"}]},{"id":"crest","name":"Spotify O-Crest","fes":"さとモンFES 2026","open":"10:30","color":"#a78bfa","shows":[{"id":"crest-0","start":"11:00","end":"11:25","name":"さとりモンスター"},{"id":"crest-1","start":"11:25","end":"11:50","name":"Drawry."},{"id":"crest-2","start":"11:50","end":"12:15","name":"PUREMORPH"},{"id":"crest-3","start":"12:15","end":"12:30","name":"のののん"},{"id":"crest-4","start":"12:30","end":"12:45","name":"三栗なの"},{"id":"crest-5","start":"12:45","end":"13:00","name":"シンNTK清楚部"},{"id":"crest-6","start":"13:15","end":"13:35","name":"海中くらげ"},{"id":"crest-7","start":"13:40","end":"14:05","name":"ふぇありーているず！"},{"id":"crest-8","start":"14:05","end":"14:30","name":"SHAKEBE"},{"id":"crest-9","start":"14:30","end":"14:55","name":"純情のアフィリア"},{"id":"crest-10","start":"14:55","end":"15:20","name":"ラグナセカイ。"},{"id":"crest-11","start":"15:20","end":"15:45","name":"ROY Limited GIRLFRIEND"},{"id":"crest-12","start":"16:10","end":"16:30","name":"ばぶばぶゆなちゃんず"},{"id":"crest-13","start":"16:40","end":"17:05","name":"mahoroba"},{"id":"crest-14","start":"17:15","end":"17:40","name":"さとモンFESコラボステージ"},{"id":"crest-15","start":"17:40","end":"18:05","name":"Noreco"},{"id":"crest-16","start":"18:15","end":"18:40","name":"ピュアリーモンスター"},{"id":"crest-17","start":"18:40","end":"19:05","name":"パピプペポは難しい"},{"id":"crest-18","start":"19:05","end":"19:30","name":"i_andscape."},{"id":"crest-19","start":"19:30","end":"19:55","name":"空想ロマンス"},{"id":"crest-20","start":"19:55","end":"20:20","name":"会心ノ一撃"}]},{"id":"garret","name":"GARRET UDAGAWA","fes":"CAKES & ALE","open":"11:40","color":"#34d399","shows":[{"id":"garret-0","start":"12:00","end":"12:25","name":"AFTERS"},{"id":"garret-1","start":"12:25","end":"12:50","name":"ENDER YEAHHHz"},{"id":"garret-2","start":"12:50","end":"13:15","name":"ug/y"},{"id":"garret-3","start":"13:15","end":"13:40","name":"YA’ABURNEE"},{"id":"garret-4","start":"13:40","end":"14:05","name":"Chalca"},{"id":"garret-5","start":"14:20","end":"14:45","name":"折原伊桜"},{"id":"garret-6","start":"14:45","end":"15:10","name":"FOKALITE"},{"id":"garret-7","start":"15:10","end":"15:35","name":"AIWO"},{"id":"garret-8","start":"15:35","end":"16:00","name":"アストレイル"},{"id":"garret-9","start":"16:00","end":"16:25","name":"buGG"},{"id":"garret-10","start":"16:50","end":"17:15","name":"lonlium"},{"id":"garret-11","start":"17:15","end":"17:40","name":"Drawry."},{"id":"garret-12","start":"17:40","end":"18:05","name":"キュニコ"},{"id":"garret-13","start":"18:05","end":"18:30","name":"0番線と夜明け前"},{"id":"garret-14","start":"18:30","end":"18:55","name":"月刊PAM"},{"id":"garret-15","start":"18:55","end":"19:20","name":"校庭カメラガールフィンフ"},{"id":"garret-16","start":"19:20","end":"19:45","name":"RAY"}]},{"id":"cyclone","name":"SHIBUYA CYCLONE","fes":"CAKES & ALE","open":"11:40","color":"#fbbf24","shows":[{"id":"cyclone-0","start":"12:15","end":"12:40","name":"KAMAITACI"},{"id":"cyclone-1","start":"12:40","end":"13:05","name":"アキストゼネコ"},{"id":"cyclone-2","start":"13:05","end":"13:30","name":"I to U $CREAMing!!"},{"id":"cyclone-3","start":"13:30","end":"13:55","name":"XINXIN"},{"id":"cyclone-4","start":"13:55","end":"14:20","name":"美味しい曖昧"},{"id":"cyclone-5","start":"14:35","end":"15:00","name":"NUANCE"},{"id":"cyclone-6","start":"15:00","end":"15:25","name":"diig"},{"id":"cyclone-7","start":"15:25","end":"15:50","name":"BNSI"},{"id":"cyclone-8","start":"15:50","end":"16:15","name":"hakanai"},{"id":"cyclone-9","start":"16:15","end":"16:40","name":"クマリデパート"},{"id":"cyclone-10","start":"17:05","end":"17:30","name":"SITUASION"},{"id":"cyclone-11","start":"17:30","end":"17:55","name":"Ma’Scar’Piece"},{"id":"cyclone-12","start":"17:55","end":"18:20","name":"RePLAY"},{"id":"cyclone-13","start":"18:20","end":"18:45","name":"Axelight"},{"id":"cyclone-14","start":"18:45","end":"19:10","name":".LiNIXLiNE."},{"id":"cyclone-15","start":"19:10","end":"19:35","name":"ミームトーキョー"},{"id":"cyclone-16","start":"19:35","end":"20:00","name":"AFTERS"}]}];
const START=630,END=1290,SCALE=3,KEY='fes-20261012-fourvenues-v1';
const $=id=>document.getElementById(id);
const escapeHTML=text=>String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const minutes=text=>{const [h,m]=text.split(':').map(Number);return h*60+m};
const formatTime=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const shows=venues.flatMap(venue=>venue.shows.map(show=>({...show,venue:venue.name,color:venue.color,s:minutes(show.start),e:minutes(show.end)})));
const knownIDs=new Set(shows.map(show=>show.id));
let selected=new Set();
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&Array.isArray(saved.ids))selected=new Set(saved.ids.filter(id=>knownIDs.has(id)));}catch{}
function save(){try{localStorage.setItem(KEY,JSON.stringify({ids:[...selected]}));}catch{}}
function refresh(){
 for(const show of shows){const card=$(show.id);card.classList.toggle('selected',selected.has(show.id));card.querySelector('input').checked=selected.has(show.id);}
 $('shadows').innerHTML=shows.filter(show=>selected.has(show.id)).map(show=>`<div class="shadow" style="top:${(show.s-START)*SCALE}px;height:${(show.e-show.s)*SCALE}px"></div>`).join('');
}
$('headers').innerHTML='<div class="time-header">時刻</div>'+venues.map(venue=>`<div class="venue-header" style="--color:${venue.color}"><h1 class="venue-name">${escapeHTML(venue.name)}</h1><p class="venue-meta">${escapeHTML(venue.fes)} ・ 開場 ${venue.open}</p></div>`).join('');
$('timeline').style.height=`${(END-START)*SCALE}px`;
for(let m=START;m<END;m+=30){const tick=document.createElement('span');tick.className='tick'+(m%60?' half':'');tick.style.top=`${(m-START)*SCALE+(m===START?9:0)}px`;tick.textContent=formatTime(m);$('ruler').append(tick);}
for(const venue of venues){const column=document.createElement('section');column.className='column';column.style.setProperty('--color',venue.color);column.setAttribute('aria-label',venue.name);for(const show of shows.filter(show=>venue.shows.some(s=>s.id===show.id))){const card=document.createElement('label');card.id=show.id;card.className='event'+((show.e-show.s)*SCALE<49?' short':'');card.style.top=`${(show.s-START)*SCALE+1}px`;card.style.height=`${(show.e-show.s)*SCALE-2}px`;card.title=`${show.start}–${show.end} ${show.name}\n${show.venue}`;card.innerHTML=`<input type="checkbox" aria-label="${escapeHTML(`${show.name} ${show.start}から${show.end} ${show.venue}を選択`)}"><span class="info"><span class="event-time">${show.start}–${show.end}</span><span class="event-name">${escapeHTML(show.name)}</span></span>`;card.querySelector('input').addEventListener('change',event=>{if(event.target.checked)selected.add(show.id);else selected.delete(show.id);save();refresh();});column.append(card);}$('timeline').append(column);}
refresh();
</script>
</body></html>
